<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BlindCast · 隐播控制台</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0d12;color:#e8eaf0;
  margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:rgba(20,24,33,.9);border:1px solid rgba(255,255,255,.12);border-radius:18px;
  padding:28px 30px;max-width:360px;width:90vw;text-align:center}
.card h1{margin:0 0 6px;font-size:20px}
.card h1 b{color:#34d399}
.card p{color:rgba(232,234,240,.55);font-size:13px;line-height:1.8}
.card input{width:100%;margin-top:10px;padding:12px 14px;font-size:15px;color:#e8eaf0;box-sizing:border-box;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;outline:none}
.card button{width:100%;margin-top:14px;padding:11px 0;border-radius:12px;cursor:pointer;
  border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.16);color:#34d399;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1><b>▚ BlindCast</b> · 隐播</h1>
  <p>输入挂机手机的局域网 IP<br>（App 首页二维码下方有显示）</p>
  <input id="ip" placeholder="如 192.168.31.216" autocomplete="off">
  <button id="go">打开硬解控制台</button>
</div>
<script src="popup.js"></script>
</body>
</html>
