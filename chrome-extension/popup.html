<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BlindCast · 隐播控制台</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0d12;color:#e8eaf0;
  margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:rgba(20,24,33,.9);border:1px solid rgba(255,255,255,.12);border-radius:18px;
  padding:20px;width:320px;box-sizing:border-box;text-align:center}
.card h1{margin:0 0 6px;font-size:20px}
.card h1 b{color:#34d399}
.card p{color:rgba(232,234,240,.55);font-size:13px;line-height:1.8;margin:8px 0}
.card input{width:100%;margin-top:10px;padding:12px 14px;font-size:15px;color:#e8eaf0;box-sizing:border-box;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;outline:none}
.card input:focus{border-color:#34d399}
.card button{width:100%;margin-top:10px;padding:11px 0;border-radius:12px;cursor:pointer;
  border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.16);color:#34d399;font-size:15px;font-weight:700}
.card button.ghost{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(232,234,240,.55)}
.card button:disabled{opacity:.45;cursor:default}
.sec{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);text-align:left}
.sec h2{margin:0 0 4px;font-size:13px;font-weight:700;color:rgba(232,234,240,.8)}
.sec .tip{font-size:11px;color:rgba(232,234,240,.4);line-height:1.6;margin:0 0 4px}
.row{display:flex;flex-direction:column;gap:0}
ul.list{list-style:none;margin:8px 0 0;padding:0}
ul.list li button{width:100%;min-height:40px;margin-top:8px;padding:8px 12px;font-size:14px;font-weight:400;
  display:flex;align-items:center;gap:8px;text-align:left;color:#e8eaf0;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:12px;cursor:pointer}
ul.list li button small{margin-left:auto;font-size:11px;color:rgba(232,234,240,.45);white-space:nowrap}
ul.list li button:hover{border-color:rgba(52,211,153,.45)}
.empty{font-size:12px;color:rgba(232,234,240,.4);line-height:1.8;margin:8px 0 0}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#34d399;border-radius:3px;transition:width .15s}
</style>
</head>
<body>
<div class="card">
  <h1><b>▚ BlindCast</b> · 隐播</h1>
  <p>输入挂机手机的局域网 IP<br>（App 首页二维码下方有显示）</p>
  <div class="row">
    <input id="ip" placeholder="如 192.168.31.216" autocomplete="off">
    <button id="go">打开硬解控制台</button>
  </div>

  <div class="sec">
    <h2>最近连接</h2>
    <ul class="list" id="histList"></ul>
    <p class="empty" id="histEmpty">暂无历史，输一次 IP 就会记住（最近 5 个）。</p>
  </div>

  <div class="sec">
    <h2>局域网发现</h2>
    <p class="tip">和手机连同一 Wi-Fi，确认网段前缀后点扫描。</p>
    <div class="row">
      <input id="prefix" value="192.168.31." autocomplete="off" spellcheck="false">
      <button id="scanBtn" class="ghost">扫描 192.168.31.1–254</button>
    </div>
    <div class="prog"><i id="scanBar"></i></div>
    <ul class="list" id="foundList"></ul>
    <p class="empty" id="scanMsg"></p>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
